<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dawson Williams</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    :root {
      --bg-start: #0a0a0f;
      --bg-end: #15151f;
      --fg: #f5f5f7;
      --muted: rgba(245, 245, 247, 0.6);
      --accent: #f5f5f7;
      --accent-fg: #0a0a0f;
      --border: rgba(245, 245, 247, 0.12);
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: var(--fg);
      background: var(--bg-start);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(ellipse at top left, rgba(120, 119, 198, 0.15), transparent 50%),
        radial-gradient(ellipse at bottom right, rgba(255, 119, 198, 0.1), transparent 50%),
        linear-gradient(180deg, var(--bg-start), var(--bg-end));
    }

    .grid-bg {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
      -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
      pointer-events: none;
    }

    main {
      position: relative;
      z-index: 1;
      text-align: center;
      max-width: 540px;
      animation: fadeUp 0.8s ease-out;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.4rem 0.9rem;
      font-size: 0.8rem;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 999px;
      background: rgba(255,255,255,0.02);
      backdrop-filter: blur(8px);
      margin-bottom: 1.75rem;
    }

    .badge::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #4ade80;
      box-shadow: 0 0 8px #4ade80;
    }

    h1 {
      font-size: clamp(2.25rem, 6vw, 3.5rem);
      font-weight: 600;
      letter-spacing: -0.03em;
      line-height: 1.05;
      margin: 0 0 1rem;
    }

    p.lead {
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.6;
      margin: 0 0 2.5rem;
    }

    .cta {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.95rem 1.6rem;
      background: var(--accent);
      color: var(--accent-fg);
      text-decoration: none;
      font-weight: 500;
      font-size: 0.98rem;
      border-radius: 999px;
      border: 1px solid transparent;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
      box-shadow: 0 8px 24px rgba(245, 245, 247, 0.08);
    }

    .cta:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 32px rgba(245, 245, 247, 0.16);
    }

    .cta:active { transform: translateY(0); }

    .cta svg {
      transition: transform 0.2s ease;
    }

    .cta:hover svg {
      transform: translateX(2px);
    }

    footer {
      position: absolute;
      bottom: 1.5rem;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 0.8rem;
      color: var(--muted);
      z-index: 1;
    }
  </style>
</head>
<body>
  <div class="grid-bg" aria-hidden="true"></div>

  <main>
    <span class="badge">Available for new opportunities</span>
    <h1>Dawson Williams</h1>
    <p class="lead">Get in touch — I'd love to hear from you.</p>
    <a class="cta" href="mailto:contact@dawsonwilliams.org">
      contact@dawsonwilliams.org
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="5" y1="12" x2="19" y2="12"></line>
        <polyline points="12 5 19 12 12 19"></polyline>
      </svg>
    </a>
  </main>

  <footer>&copy; <span id="year"></span> Dawson Williams</footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
